services:
  agentic-bot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: agentic-bot

    working_dir: /app

    ports:
      - "9000:9000"

    env_file:
      - .env

    volumes:
      - .:/app

    depends_on:
      pgsql:
        condition: service_healthy

    networks:
      - chatbot-network

    restart: unless-stopped

    #healthcheck:
    #  test:
    #    - CMD
    #    - python
    #    - -c
    #    - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/api/v1/health/')"
    #  interval: 30s
    #  timeout: 10s
    #  retries: 3
    #  start_period: 10s

  pgsql:
    image: postgres:14.6

    container_name: ai-pgsql

    environment:
      POSTGRES_DB: ai_chat
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_user

    ports:
      - "5436:5432"

    volumes:
      - ai-postgres-data:/var/lib/postgresql/data

    networks:
      - chatbot-network

    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis:7.4-alpine
    container_name: ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - chatbot-network

networks:
  chatbot-network:
    external: true
    name: chatbot-network

volumes:
  ai-postgres-data:
  redis_data: